<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Castle Defender: Frontline Run</title>
  <style>
    :root{--ink:#172033;--paper:#fff6df;--blue:#76c9e9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(#86d3ed,#d9f3db);color:var(--ink);font-family:system-ui,sans-serif}.wrap{width:min(100vw,1000px);padding:14px}header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}h1{margin:0;font-size:clamp(1.15rem,4vw,2rem)}button{border:2px solid var(--ink);border-radius:10px;background:var(--paper);padding:8px 11px;font-weight:800;color:var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer}button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}.buttons{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.hud{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-weight:800;margin:6px 0}.hud span{background:#ffffffbb;padding:4px 8px;border-radius:8px}canvas{display:block;width:100%;aspect-ratio:6/5;border:4px solid var(--ink);border-radius:14px;background:var(--blue);box-shadow:0 8px 0 #17203338;touch-action:none}.help{text-align:center;font-size:.9rem;margin:9px 0 0}.modal{position:fixed;inset:0;display:grid;place-items:center;background:#17203399;padding:18px}.modal[hidden]{display:none}.card{width:min(440px,100%);padding:22px;background:var(--paper);border:4px solid var(--ink);border-radius:16px;text-align:center;box-shadow:0 8px 0 var(--ink)}.card h2{margin-top:0}.card p{line-height:1.45}.toast{position:fixed;bottom:17px;left:50%;transform:translateX(-50%);padding:9px 14px;border-radius:999px;background:var(--ink);color:white;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
  </style>
</head>
<body>
<main class="wrap"><header><h1>🏰 Castle Defender: Frontline Run</h1><div class="buttons"><button id="buyTroopBtn">Buy Troop (10)</button><button id="buildBlockBtn">Build Block (15)</button><button id="upgradeBlocksBtn">Upgrade Blocks (30)</button><button id="upgradeWallsBtn">Upgrade Walls (50)</button><button id="repairWallsBtn">Repair Walls (20)</button><button id="mineBtn">Buy Mine (40)</button><button id="upgradeMinesBtn">Upgrade Mines (60)</button><button id="unlockTroopBtn">Unlock Gunner (50)</button><button id="leftBowBtn">Left Crossbow (25)</button><button id="rightBowBtn">Right Crossbow (25)</button><button id="mergeBtn" disabled>Merge Troops</button><button id="frontBtn">Front: Knife Fighters</button><button id="middleBtn">Middle: Cannon</button><button id="backBtn">Back: Mage</button><button id="skinBtn">Troop Skin</button><button id="upgradeBtn">Upgrade</button><button id="scoresBtn">Leaderboard</button></div></header>
<div class="hud"><span id="score">Score: 0</span><span id="coins">Coins: 0</span><span id="blocks">Blocks: 0</span><span id="wallHealth">Walls: 3/3</span><span id="mines">Mines: 0</span><span id="crossbows">Crossbows: 0/12</span><span id="wave">Checkpoint: 1</span><span id="army">Squad: 4 • Tier 1</span><span id="health">Squad HP: 100/100</span><span id="distance">Distance: 0m</span><span id="power">Power: 1</span></div>
<canvas id="game" width="960" height="800" aria-label="Castle Defender survival runner"></canvas>
<p class="help">Drag or tap to steer • Arrow keys/WASD move • Up/Down moves the squad forward/back • Troops fire automatically</p></main>
<section class="modal" id="gameOver" hidden><div class="card"><h2>Frontline lost</h2><p id="resultText"></p><button id="againBtn">Play Again</button></div></section><div class="toast" id="toast"></div>
<script>
// Change these numbers to tune the game. Each setting controls one part of play.
const CONFIG={
  width:960,height:800, // Internal canvas size; taller gives more reaction time.
  startingArmy:4, // Troops in the squad at the start.
  mergeAt:10, // Same-tier troops needed to merge into one better troop.
  runSpeed:125, // How quickly the road moves toward the squad.
  laneMoveSpeed:520, // How quickly keyboard steering changes lanes.
  troopCost:10, // Coins needed to recruit one troop.
  blockCost:15, // Coins needed to build one block.
  blockMaxHealth:80, // Health of a newly built block.
  blockWidth:110, // Width of a block barrier.
  blockDamagePerSecond:28, // Damage hordes deal while attacking a block.
  blockSpikeDamage:16, // Damage dealt by spikes to enemies touching a block.
  wallMaxHealth:1400, // Starting health of the heavily reinforced cobblestone wall.
  wallLayerHealth:[5200,4400,3600], // Large health pools for the front, middle, and back wall layers.
  wallUpgradeCost:50, // Coins needed to strengthen every wall layer.
  wallUpgradeHealth:1400, // Max health added to each wall layer per upgrade.
  wallUpgradeSpikeDamage:6, // Spike damage added to each wall upgrade.
  wallUpgradeFlameDamage:8, // Flamethrower damage added to each wall upgrade.
  wallGraceMs:30000, // First 30 seconds when walls cannot take damage.
  wallDamagePerSecond:6, // Slow damage the horde deals while breaking into the wall.
  wallRepairCost:20, // Coins needed to repair the wall.
  wallRepairAmount:999999, // Full-wall repair amount; repairs always fill every layer.
  wallGuardCount:6, // Permanent troops stationed on top of the wall.
  wallGuardFireMs:850, // Time between wall guard volleys.
  wallGuardDamage:5, // Damage from each wall guard arrow.
  wallSpikeDamage:18, // Damage from the spikes on every wall layer.
  wallFlameCount:10, // Number of flamethrowers spread across each wall.
  wallFlameDamage:12, // Damage each flamethrower deals every second.
  wallFlameRange:95, // Distance in front of a wall covered by flames.
  decoyLifeMs:8000, // How long a block decoy stays after walls fall.
  mineCost:40, // Coins needed to build a money-generating mine.
  mineMax:3, // Maximum mines that can be active at once.
  mineMaxHealth:2400, // Health of each mine before enemies destroy it.
  mineY:735, // Back-line position where mines are built.
  mineIncomeMs:2000, // Time between mine payouts.
  mineIncome:8, // Coins earned by a mine each payout.
  mineUpgradeCost:60, // Coins needed to upgrade all active mines.
  mineUpgradeIncome:5, // Extra coins per payout for each mine upgrade.
  mineUpgradeHealth:500, // Extra max health for each mine upgrade.
  mineUpgradeGuardDamage:4, // Extra guard damage for each mine upgrade.
  mineDamagePerSecond:3, // Damage enemies deal while attacking a mine.
  mineGuardCount:2, // Stationary guards protecting each mine.
  mineGuardFireMs:700, // Time between mine guard shots.
  mineGuardDamage:6, // Damage from each mine guard shot.
  playerCannonFireMs:5000, // Time between giant player cannon shots.
  playerCannonDamage:35, // Damage from the giant cannonball.
  playerCannonSplash:90, // Blast radius of the giant cannonball.
  playerCannonSpeed:520, // Speed of the giant cannonball.
  blockUpgradeCost:30, // Coins needed to upgrade every built block.
  blockUpgradeHealth:35, // Extra health given to each block upgrade.
  blockUpgradeSpikeDamage:8, // Extra spike damage given to each block upgrade.
  coinPerMob:3, // Coins earned when a normal mob is defeated.
  coinPerBoss:15, // Coins earned when a boss is defeated.
  coinPerMega:40, // Coins earned when a mega boss is defeated.
  crossbowCost:25, // Coins needed for one side crossbow.
  crossbowMaxPerSide:6, // Maximum crossbows that can be built on each side.
  troopUnlockCost:50, // Coins needed to unlock the Gunner troop.
  crossbowFireMs:700, // Time between automatic crossbow bolts.
  crossbowSpeed:430, // Speed of crossbow bolts.
  crossbowDamage:5, // Damage from one crossbow bolt.
  enemyStreamRate:22, // Mobs added every second with no empty spawn breaks.
  maxActiveEnemies:75, // Keeps the endless horde readable while new enemies keep trying to arrive.
  enemyMinX:410, // Left edge of the enemy-only middle lane.
  enemyMaxX:550, // Right edge of the enemy-only middle lane.
  enemySpawnMinX:140, // Left edge of the full horde spawn area.
  enemySpawnMaxX:820, // Right edge of the full horde spawn area.
  corridorMinX:205, // Left edge the player can reach for the far-left multiplier.
  corridorMaxX:755, // Right edge the player can reach for the far-right multiplier.
  playerLine:685, // Vertical position of the squad near the bottom.
  squadMoveSpeed:230, // Forward/backward movement speed for the squad.
  squadMinY:140, // Farthest forward the squad can move across the playfield.
  squadMaxY:720, // Farthest backward the squad can move across the playfield.
  boulderSpacing:500, // Distance between paired side boulders.
  boulderStartHits:5, // Bullets needed to break a starting boulder.
  powerUpAmount:1, // Power gained from a broken-boulder power-up.
  troopFireMs:450, // How often troops fire automatically.
  troopBaseDamage:2, // Base damage from each regular troop shot.
  upgradePowerGain:3, // Big damage boost given by the score-based squad upgrade.
  bulletSpeed:360, // Speed of friendly bullets.
  bulletLifeMs:650, // Maximum time a bullet stays on screen.
  enemyApproachSpeed:280, // Fast movement speed that still gives the squad time to shoot.
  enemyDamage:4, // Base troops lost when one enemy reaches the squad.
  enemyDamagePerCheckpoint:3, // Extra damage added at every checkpoint.
  enemyHealthGrowth:1.2, // Percentage health growth per checkpoint.
  enemyDamageGrowth:1.15, // Percentage attack growth per checkpoint.
  enemyArcherChance:.16, // Chance that a normal horde member is an enemy archer.
  enemyArcherFireMs:900, // Time between enemy archer shots.
  enemyArcherDamage:24, // Base damage enemy arrows deal to blocks.
  enemyBaseHp:5, // Starting health for a normal enemy.
  enemyHpPerCheckpoint:7, // Extra enemy health as checkpoints rise.
  bossEvery:3, // A boss appears at every third checkpoint.
  megaBossEvery:5, // A guaranteed mega boss appears every fifth checkpoint.
  megaHordeChance:.012, // Occasional chance for a giant shielded horde leader.
  megaShieldHealth:300, // Shield health before a mega leader takes damage.
  megaChaseSpeed:180, // Side-to-side chase speed of a mega horde leader.
  mergeDamageBonus:2, // Extra power gained whenever troops merge.
  checkpointSquadFloor:4, // Minimum squad count carried through a checkpoint.
  startingPower:1, // Troop damage level.
  troopTierDamage:3, // Extra damage each troop gains for every tier above level 1.
  troopGap:24, // Horizontal space between troops in a row.
  troopRowGap:32, // Vertical space between troop rows.
  frontRowOffset:-70, // How far forward the knife fighters stand.
  middleRowOffset:-25, // Position of the archer row behind the knives.
  backRowOffset:25, // Position of the mage row.
  troopRows:3, // Exactly three defensive rows: front, middle, and back.
  troopRadius:10, // Fixed troop body size at every tier.
  knifeDamageBonus:8, // Extra damage from the high-rank front-row knife troops.
  mageDamageBonus:4, // Extra damage from back-row mage troops.
  gunnerDamageBonus:0, // Extra damage from middle-row gunner troops.
  archerDamageBonus:4, // Extra damage from ranged archers behind the knives.
  maxSquadHealth:100, // Starting health shared by the squad.
  mageHeal:4, // Health restored by each mage volley.
  mageSplashRadius:52, // Radius of a mage's splash attack.
};
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const scoreEl=document.querySelector('#score'),coinsEl=document.querySelector('#coins'),blocksEl=document.querySelector('#blocks'),wallHealthEl=document.querySelector('#wallHealth'),minesEl=document.querySelector('#mines'),crossbowsEl=document.querySelector('#crossbows'),buyTroopBtn=document.querySelector('#buyTroopBtn'),buildBlockBtn=document.querySelector('#buildBlockBtn'),upgradeBlocksBtn=document.querySelector('#upgradeBlocksBtn'),upgradeWallsBtn=document.querySelector('#upgradeWallsBtn'),repairWallsBtn=document.querySelector('#repairWallsBtn'),mineBtn=document.querySelector('#mineBtn'),upgradeMinesBtn=document.querySelector('#upgradeMinesBtn'),unlockTroopBtn=document.querySelector('#unlockTroopBtn'),leftBowBtn=document.querySelector('#leftBowBtn'),rightBowBtn=document.querySelector('#rightBowBtn'),waveEl=document.querySelector('#wave'),armyEl=document.querySelector('#army'),healthEl=document.querySelector('#health'),distanceEl=document.querySelector('#distance'),powerEl=document.querySelector('#power'),mergeBtn=document.querySelector('#mergeBtn'),frontBtn=document.querySelector('#frontBtn'),middleBtn=document.querySelector('#middleBtn'),backBtn=document.querySelector('#backBtn'),gameOver=document.querySelector('#gameOver'),resultText=document.querySelector('#resultText'),toast=document.querySelector('#toast');
let game,last=0,keys={},dragging=false,skin=0,upgrade=0,frontType='knife',middleType='cannon',backType='mage',scores=JSON.parse(localStorage.getItem('castleRunnerScores')||'[]');
const skinColors=['#ef476f','#8e5de7','#06d6a0'];
const tierColors=['#ffd166','#f4a261','#e76f51','#b565d9'];
function reset(){game={running:true,score:0,coins:0,blocks:[],walls:[{x:480,y:250,width:660,hp:CONFIG.wallLayerHealth[0],maxHp:CONFIG.wallLayerHealth[0],spikeDamage:CONFIG.wallSpikeDamage,flameDamage:CONFIG.wallFlameDamage},{x:480,y:390,width:660,hp:CONFIG.wallLayerHealth[1],maxHp:CONFIG.wallLayerHealth[1],spikeDamage:CONFIG.wallSpikeDamage,flameDamage:CONFIG.wallFlameDamage},{x:480,y:530,width:660,hp:CONFIG.wallLayerHealth[2],maxHp:CONFIG.wallLayerHealth[2],spikeDamage:CONFIG.wallSpikeDamage,flameDamage:CONFIG.wallFlameDamage}],wallLevel:1,mines:[],wallGraceRemaining:CONFIG.wallGraceMs,wallGuardTimer:0,cannonTimer:0,placingBlock:false,blockLevel:1,gunnerUnlocked:false,crossbows:{left:0,right:0},crossbowTimer:0,army:CONFIG.startingArmy,troopTiers:Array(CONFIG.startingArmy).fill(1),checkpointArmy:CONFIG.startingArmy,tier:1,squadHealth:CONFIG.maxSquadHealth,squadMaxHealth:CONFIG.maxSquadHealth,squadY:CONFIG.playerLine,distance:0,checkpoint:1,megaBossCheckpoint:0,gatesPassed:0,road:0,laneX:480,gateAt:Infinity,enemyStream:0,boulderAt:520,nextShot:0,bullets:[],enemyBullets:[],gates:[],enemies:[],boulders:[],powerups:[],power:CONFIG.startingPower};gameOver.hidden=true;updateHud();}
function syncArmy(){game.army=game.troopTiers.length;game.tier=Math.max(...game.troopTiers,1);}
function applyGateAmount(amount){if(amount>=0){for(let i=0;i<amount;i++)game.troopTiers.push(1);}else{game.troopTiers.splice(0,Math.min(game.troopTiers.length,Math.abs(amount)));}syncArmy();}
function updateHud(){syncArmy();scoreEl.textContent=`Score: ${game.score}`;coinsEl.textContent=`Coins: ${game.coins}`;blocksEl.textContent=`Blocks: ${game.blocks.length} • Lv ${game.blockLevel}`;const wall=game.walls.find(w=>w.hp< w.maxHp)||game.walls[0];const liveWalls=game.walls.filter(w=>w.hp>0).length;wallHealthEl.textContent=`Walls: ${liveWalls}/${game.walls.length} • Lv ${game.wallLevel}`;minesEl.textContent=`Mines: ${game.mines.length}`;const bowCount=game.crossbows.left+game.crossbows.right;crossbowsEl.textContent=`Crossbows: ${bowCount}/${CONFIG.crossbowMaxPerSide*2}`;waveEl.textContent=`Checkpoint: ${game.checkpoint}`;armyEl.textContent=`Squad: ${Math.max(0,game.army)} • Top Tier ${game.tier}`;healthEl.textContent=`Squad HP: ${Math.ceil(game.squadHealth)}/${game.squadMaxHealth}`;distanceEl.textContent=`Distance: ${Math.floor(game.distance/10)}m`;powerEl.textContent=`Power: ${game.power}`;buyTroopBtn.disabled=game.coins<CONFIG.troopCost;buildBlockBtn.disabled=!game.placingBlock&&game.coins<CONFIG.blockCost;buildBlockBtn.textContent=game.placingBlock?'Finish Blocks':'Build Block (15)';upgradeBlocksBtn.disabled=!game.blocks.length||game.coins<CONFIG.blockUpgradeCost;upgradeBlocksBtn.textContent=`Upgrade Blocks (${CONFIG.blockUpgradeCost})`;upgradeWallsBtn.disabled=game.coins<CONFIG.wallUpgradeCost;upgradeWallsBtn.textContent=`Upgrade Walls (${CONFIG.wallUpgradeCost})`;repairWallsBtn.disabled=!game.walls.some(w=>w.hp<w.maxHp)||game.coins<CONFIG.wallRepairCost;repairWallsBtn.textContent=`Repair All Walls (${CONFIG.wallRepairCost})`;mineBtn.disabled=game.mines.length>=CONFIG.mineMax||game.coins<CONFIG.mineCost;mineBtn.textContent=`Buy Mine (${CONFIG.mineCost})`;upgradeMinesBtn.disabled=!game.mines.length||game.coins<CONFIG.mineUpgradeCost;upgradeMinesBtn.textContent=`Upgrade Mines (${CONFIG.mineUpgradeCost})`;unlockTroopBtn.disabled=game.gunnerUnlocked||game.coins<CONFIG.troopUnlockCost;unlockTroopBtn.textContent=game.gunnerUnlocked?'Gunner Unlocked ✓':`Unlock Gunner (${CONFIG.troopUnlockCost})`;leftBowBtn.disabled=game.crossbows.left>=CONFIG.crossbowMaxPerSide||game.coins<CONFIG.crossbowCost;rightBowBtn.disabled=game.crossbows.right>=CONFIG.crossbowMaxPerSide||game.coins<CONFIG.crossbowCost;leftBowBtn.textContent=`Left Crossbow ${game.crossbows.left}/${CONFIG.crossbowMaxPerSide}`;rightBowBtn.textContent=`Right Crossbow ${game.crossbows.right}/${CONFIG.crossbowMaxPerSide}`;mergeBtn.disabled=!game.troopTiers.some(t=>game.troopTiers.filter(x=>x===t).length>=CONFIG.mergeAt);mergeBtn.textContent=mergeBtn.disabled?'Need 10 matching troops':'Merge 10 Troops';}
function toastMsg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>toast.classList.remove('show'),2100);}
function pointerX(e){const r=canvas.getBoundingClientRect();return (e.clientX-r.left)*CONFIG.width/r.width;}
function pointerY(e){const r=canvas.getBoundingClientRect();return (e.clientY-r.top)*CONFIG.height/r.height;}
function steer(x){game.laneX=Math.max(CONFIG.corridorMinX,Math.min(CONFIG.corridorMaxX,x));}
canvas.addEventListener('pointerdown',e=>{if(game.placingBlock){if(game.coins<CONFIG.blockCost){game.placingBlock=false;toastMsg('Not enough coins for another block');updateHud();return;}const x=Math.max(125,Math.min(835,pointerX(e))),fallenWalls=game.walls.every(w=>w.hp<=0),y=fallenWalls?game.walls[game.blocks.length%game.walls.length].y:Math.max(80,Math.min(760,pointerY(e)));game.coins-=CONFIG.blockCost;game.blocks.push({x,y,spikes:true,hp:CONFIG.blockMaxHealth,maxHp:CONFIG.blockMaxHealth,spikeDamage:CONFIG.blockSpikeDamage,decoy:fallenWalls,decoyTimer:fallenWalls?CONFIG.decoyLifeMs:Infinity});toastMsg(fallenWalls?'Temporary wall decoy placed!':'Spiked block placed!');updateHud();return;}dragging=true;steer(pointerX(e));});canvas.addEventListener('pointermove',e=>{if(dragging)steer(pointerX(e));});window.addEventListener('pointerup',()=>dragging=false);
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='m'&&game.army>=CONFIG.mergeAt)mergeSquad();});window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
document.querySelector('#againBtn').onclick=reset;
buyTroopBtn.onclick=()=>{if(game.coins>=CONFIG.troopCost){game.coins-=CONFIG.troopCost;game.troopTiers.push(1);syncArmy();toastMsg('New level 1 troop recruited');}updateHud();};
buildBlockBtn.onclick=()=>{if(game.placingBlock){game.placingBlock=false;toastMsg('Block placement cancelled');}else if(game.coins>=CONFIG.blockCost){game.placingBlock=true;toastMsg('Tap or click to place blocks; each tap spends coins');}updateHud();};
upgradeBlocksBtn.onclick=()=>{if(game.blocks.length&&game.coins>=CONFIG.blockUpgradeCost){game.coins-=CONFIG.blockUpgradeCost;game.blockLevel++;for(const block of game.blocks){block.maxHp+=CONFIG.blockUpgradeHealth;block.hp=block.maxHp;block.spikeDamage+=CONFIG.blockUpgradeSpikeDamage;}toastMsg(`Blocks upgraded to level ${game.blockLevel}`);}updateHud();};
upgradeWallsBtn.onclick=()=>{if(game.coins>=CONFIG.wallUpgradeCost){game.coins-=CONFIG.wallUpgradeCost;game.wallLevel++;for(const wall of game.walls){wall.maxHp+=CONFIG.wallUpgradeHealth;wall.hp=wall.maxHp;wall.spikeDamage+=CONFIG.wallUpgradeSpikeDamage;wall.flameDamage+=CONFIG.wallUpgradeFlameDamage;}toastMsg(`Walls upgraded to level ${game.wallLevel} and fully repaired`);}updateHud();};
repairWallsBtn.onclick=()=>{if(game.walls.some(w=>w.hp<w.maxHp)&&game.coins>=CONFIG.wallRepairCost){game.coins-=CONFIG.wallRepairCost;for(const wall of game.walls)wall.hp=wall.maxHp;toastMsg('All cobblestone walls fully repaired');}updateHud();};
mineBtn.onclick=()=>{if(game.mines.length<CONFIG.mineMax&&game.coins>=CONFIG.mineCost){game.coins-=CONFIG.mineCost;const spots=[300,480,660];game.mines.push({x:spots[game.mines.length],y:CONFIG.mineY,hp:CONFIG.mineMaxHealth,maxHp:CONFIG.mineMaxHealth,level:1,income:CONFIG.mineIncome,guardDamage:CONFIG.mineGuardDamage,incomeTimer:CONFIG.mineIncomeMs,guardTimer:0});toastMsg('Mine built in the back line');}updateHud();};
upgradeMinesBtn.onclick=()=>{if(game.mines.length&&game.coins>=CONFIG.mineUpgradeCost){game.coins-=CONFIG.mineUpgradeCost;for(const mine of game.mines){mine.level=(mine.level||1)+1;mine.maxHp+=CONFIG.mineUpgradeHealth;mine.hp=mine.maxHp;mine.income+=CONFIG.mineUpgradeIncome;mine.guardDamage+=CONFIG.mineUpgradeGuardDamage;}toastMsg('All mines upgraded and repaired');}updateHud();};
leftBowBtn.onclick=()=>{if(game.crossbows.left<CONFIG.crossbowMaxPerSide&&game.coins>=CONFIG.crossbowCost){game.coins-=CONFIG.crossbowCost;game.crossbows.left++;toastMsg(`Left crossbow ${game.crossbows.left} built`);}updateHud();};
rightBowBtn.onclick=()=>{if(game.crossbows.right<CONFIG.crossbowMaxPerSide&&game.coins>=CONFIG.crossbowCost){game.coins-=CONFIG.crossbowCost;game.crossbows.right++;toastMsg(`Right crossbow ${game.crossbows.right} built`);}updateHud();};
unlockTroopBtn.onclick=()=>{if(!game.gunnerUnlocked&&game.coins>=CONFIG.troopUnlockCost){game.coins-=CONFIG.troopUnlockCost;game.gunnerUnlocked=true;toastMsg('Gunner unlocked! Choose a row for it.');}updateHud();};
mergeBtn.onclick=()=>{if(game.army>=CONFIG.mergeAt)mergeSquad();else toastMsg('Reach 10 troops before merging');};
frontBtn.onclick=()=>{frontType=frontType==='knife'?'mage':'knife';frontBtn.textContent=`Front: ${frontType==='knife'?'Knife Fighters':'Mages'}`;};
 middleBtn.onclick=()=>{const choices=game.gunnerUnlocked?['cannon','archer','mage','gunner']:['cannon','archer','mage'];middleType=choices[(choices.indexOf(middleType)+1)%choices.length];middleBtn.textContent=`Middle: ${middleType[0].toUpperCase()+middleType.slice(1)}`;};
backBtn.onclick=()=>{const choices=game.gunnerUnlocked?['mage','gunner','knife']:['mage','knife'];backType=choices[(choices.indexOf(backType)+1)%choices.length];backBtn.textContent=`Back: ${backType[0].toUpperCase()+backType.slice(1)}`;};
document.querySelector('#skinBtn').onclick=()=>{skin=(skin+1)%skinColors.length;toastMsg(`Troop color ${skin+1} selected`);};
document.querySelector('#upgradeBtn').onclick=()=>{const cost=40*(upgrade+1);if(game.score>=cost){game.score-=cost;upgrade++;game.power+=CONFIG.upgradePowerGain;updateHud();toastMsg(`Squad power upgraded to ${game.power}`);}else toastMsg(`Need ${cost} points for an upgrade`);};
document.querySelector('#scoresBtn').onclick=()=>toastMsg(`Top runs: ${scores.slice(0,3).join(' • ')||'No runs yet'}`);
function addGate(){const values=[CONFIG.gateStartValue,CONFIG.gateStartValue+1];game.gates.push({y:-35,x:215,amount:values[0],side:'left'},{y:-35,x:745,amount:values[1],side:'right'});}
function addEnemy(){if(game.enemies.length>=CONFIG.maxActiveEnemies)return;const mega=(game.checkpoint%CONFIG.megaBossEvery===0&&game.megaBossCheckpoint!==game.checkpoint)||Math.random()<CONFIG.megaHordeChance;if(mega)game.megaBossCheckpoint=game.checkpoint;const boss=!mega&&game.checkpoint%CONFIG.bossEvery===0&&Math.random()<.08;const archer=!mega&&!boss&&Math.random()<CONFIG.enemyArcherChance;const growth=Math.pow(CONFIG.enemyHealthGrowth,game.checkpoint-1),normalHp=Math.floor((CONFIG.enemyBaseHp+Math.floor((game.checkpoint-1)*CONFIG.enemyHpPerCheckpoint/2))*growth),maxHp=mega?normalHp*12:boss?normalHp*4:archer?normalHp+2:normalHp;game.enemies.push({y:-55,x:CONFIG.enemySpawnMinX+Math.random()*(CONFIG.enemySpawnMaxX-CONFIG.enemySpawnMinX),r:mega?62:boss?35:20,hp:maxHp,maxHp,shield:mega?CONFIG.megaShieldHealth:0,maxShield:mega?CONFIG.megaShieldHealth:0,boss,mega,archer,shotTimer:CONFIG.enemyArcherFireMs});}

  for(const b of game.bullets){ctx.fillStyle=b.source==='player-cannon'?'#172033':b.source==='crossbow'?'#ff9f1c':'#ffe066';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();}
  const count=Math.min(game.army,45),radius=CONFIG.troopRadius;for(let i=0;i<count;i++){const p=troopPosition(i),role=troopRole(i),troopTier=game.troopTiers[i]||1,merged=troopTier>1;ctx.save();ctx.translate(p.x,p.y);if(merged){ctx.rotate(Math.PI/4);ctx.fillStyle=tierColors[Math.min(troopTier-2,tierColors.length-1)];ctx.fillRect(-radius+1,-radius+1,(radius-1)*2,(radius-1)*2);ctx.rotate(-Math.PI/4);ctx.fillStyle='#fff6df';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText(`T${troopTier}`,0,3);}else if(role==='cannon'){ctx.fillStyle='#f4a261';ctx.beginPath();ctx.arc(0,0,19,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8d99ae';ctx.fillRect(-7,-34,14,28);ctx.fillStyle='#172033';ctx.fillRect(-15,18,30,7);}else{ctx.fillStyle=role==='knife'?'#f4a261':role==='archer'?'#3a86ff':role==='mage'?'#9b5de5':skinColors[skin];ctx.beginPath();ctx.arc(0,0,radius,0,Math.PI*2);ctx.fill();}ctx.restore();ctx.strokeStyle=role==='mage'?'#c77dff':role==='knife'?'#f4a261':role==='archer'?'#3a86ff':role==='cannon'?'#f4a261':merged?'#ffe066':'#172033';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x+radius-1,p.y-2);ctx.lineTo(p.x+radius+9+(merged?troopTier*2:0),p.y-2);ctx.stroke();if(role==='mage'){ctx.fillStyle='#c77dff';ctx.beginPath();ctx.arc(p.x,p.y-radius-4,4,0,Math.PI*2);ctx.fill();}else if(role==='knife'){ctx.fillStyle='#f4a261';ctx.fillRect(p.x-2,p.y-radius-5,4,7);}else if(role==='archer'){ctx.fillStyle='#3a86ff';ctx.fillRect(p.x-2,p.y-radius-5,4,7);}ctx.fillStyle='#172033';ctx.fillRect(p.x-3,p.y-2,2,2);ctx.fillRect(p.x+2,p.y-2,2,2);}
  const mapX=748,mapY=18,mapW=190,mapH=125;ctx.fillStyle='#172033dd';ctx.fillRect(mapX,mapY,mapW,mapH);ctx.fillStyle='#fff6df';ctx.font='bold 13px system-ui';ctx.textAlign='left';ctx.fillText('MINI MAP • HORDE',mapX+10,mapY+18);ctx.fillStyle='#657487';ctx.fillRect(mapX+12,mapY+28,mapW-24,mapH-38);ctx.fillStyle='#ef476f';ctx.beginPath();ctx.arc(mapX+12+(game.laneX/CONFIG.width)*(mapW-24),mapY+mapH-17,5,0,Math.PI*2);ctx.fill();for(const e of game.enemies){ctx.fillStyle=e.mega?'#d9edff':e.boss?'#ffe066':'#f18b52';ctx.beginPath();ctx.arc(mapX+12+(e.x/CONFIG.width)*(mapW-24),mapY+30+Math.max(0,Math.min(1,e.y/CONFIG.height))*(mapH-52),e.mega?6:e.boss?4:2.5,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#fff6df';ctx.font='bold 16px system-ui';ctx.textAlign='left';ctx.fillText('Castle Defender',18,27);ctx.textAlign='center';ctx.fillText('STEER',game.laneX,CONFIG.height-40);}
function loop(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop);}reset();requestAnimationFrame(loop);
