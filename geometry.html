<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Runner</title><style>body{margin:0;background:#151934;color:#fff;font-family:system-ui,sans-serif;text-align:center}main{width:min(900px,calc(100% - 28px));margin:auto;padding:26px 0}a{color:#aab8ff}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{margin:0;font-size:clamp(30px,7vw,58px);letter-spacing:-.08em}.info{display:flex;justify-content:center;gap:24px;margin:15px;color:#c9d0ff;font-weight:800}canvas{display:block;width:100%;max-width:900px;height:auto;border:4px solid #687cff;border-radius:18px;background:var(--arcade-canvas,#25295c);box-shadow:0 18px 50px #0006}.button{border:0;border-radius:99px;padding:11px 18px;color:#172044;background:#ffd85e;font:inherit;font-weight:900;cursor:pointer}.hint{color:#9da8d7;font-size:14px}</style></head><body><main><div class="top"><a href="index.html" onclick="if(window.opener){window.close();return false}">← Arcade</a><button class="button" id="restart">Restart</button></div><h1>Neon Runner</h1><div class="info"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div><canvas id="game" width="900" height="360"></canvas><p class="hint">Press Space, ↑, or tap to jump. Spikes and blocks will end your run.</p></main><script src="shared.js?v=20260928"></script><script>
const c=document.querySelector('#game'),x=c.getContext('2d'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),restart=document.querySelector('#restart');let best=Math.max(Number(localStorage.runnerBest||0),Number(arcadeState().highScores.runner||0)),score,player,obstacles,run,frame,resume=arcadeSessionLoad('runner');bestEl.textContent=best;function start(){const saved=resume;if(saved){score=saved.score;player=saved.player;obstacles=saved.obstacles;run=true;frame=saved.frame||0;resume=null}else{score=0;player={x:95,y:275,vy:0,w:28,h:28,on:false};obstacles=[];run=true;frame=0}scoreEl.textContent=score;requestAnimationFrame(loop)}function jump(){if(run&&player.on){player.vy=-11.5;player.on=false;arcadeAddPoints(3,'runner')}else if(!run)start()}function addObstacle(){const type=Math.floor(Math.random()*3);if(type===0)obstacles.push({type,x:920,w:24,h:35+Math.random()*30});if(type===1)obstacles.push({type,x:920,w:36,h:54});if(type===2){obstacles.push({type:0,x:920,w:22,h:38});obstacles.push({type:0,x:954,w:22,h:55})}}function loop(){if(!run){draw();return}frame++;score=Math.floor(frame/7);scoreEl.textContent=score;if(frame%105===0)addObstacle();player.vy+=.58;player.y+=player.vy;if(player.y>=275){player.y=275;player.vy=0;player.on=true}for(const o of obstacles)o.x-=4.2+Math.min(score/300,1.5);obstacles=obstacles.filter(o=>o.x>-70);for(const o of obstacles){const hit=player.x<o.x+o.w&&player.x+player.w>o.x&&player.y+player.h>310-o.h;if(hit){run=false;if(score>best){best=score;localStorage.runnerBest=best;bestEl.textContent=best}arcadeRecordScore('runner',score);arcadeSessionClear('runner')}}draw();requestAnimationFrame(loop)}function draw(){x.clearRect(0,0,900,360);x.fillStyle=arcadeCanvasBackground();x.fillRect(0,0,900,360);x.strokeStyle='#5666c8';x.lineWidth=2;for(let i=0;i<900;i+=45){x.beginPath();x.moveTo(i,0);x.lineTo(i,360);x.stroke()}x.fillStyle='#ffdb62';x.fillRect(0,310,900,50);const pack=arcadeTexturePack();x.fillStyle=pack==='volcano'?'#ff7b54':pack==='forest'?'#72e6a0':pack==='ocean'?'#62dcff':pack==='sunset'?'#ff9a78':pack==='candy'?'#ff8fd0':'#fb7185';x.fillRect(player.x,player.y,player.w,player.h);x.fillStyle=pack==='pixel'?'#ffe66d':'#fff';x.fillRect(player.x+18,player.y+7,5,5);x.fillStyle='#ffffff55';x.fillRect(player.x+3,player.y+3,player.w-8,4);for(const o of obstacles){if(o.type===0){x.fillStyle=pack==='volcano'?'#ffbd59':pack==='forest'?'#8bffb0':pack==='ocean'?'#76efff':pack==='sunset'?'#ffd06b':'#70f0ff';x.beginPath();x.moveTo(o.x,310);x.lineTo(o.x+o.w/2,310-o.h);x.lineTo(o.x+o.w,310);x.fill();x.strokeStyle='#ffffff99';x.lineWidth=3;x.beginPath();x.moveTo(o.x+o.w*.25,306);x.lineTo(o.x+o.w/2,310-o.h+6);x.lineTo(o.x+o.w*.75,306);x.stroke()}else if(o.type===1){x.fillStyle=pack==='volcano'?'#ff654d':pack==='forest'?'#86d98b':pack==='ocean'?'#5da8ff':'#a479ff';x.fillRect(o.x,310-o.h,o.w,o.h);x.fillStyle=pack==='pixel'?'#61f4ff':'#f5c85b';for(let yy=310-o.h+8;yy<310;yy+=14)x.fillRect(o.x+8,yy,8,8)}}if(!run){x.fillStyle='#172044cc';x.fillRect(0,0,900,360);x.fillStyle='#fff';x.font='bold 38px system-ui';x.textAlign='center';x.fillText('Game over!',450,155);x.font='bold 20px system-ui';x.fillText('A hazard got you — restart and try again',450,195)}}addEventListener('keydown',e=>{if(['Space','ArrowUp'].includes(e.code)){e.preventDefault();jump()}});c.addEventListener('pointerdown',jump);restart.onclick=()=>{arcadeSessionClear('runner');resume=null;start()};addEventListener('beforeunload',()=>{if(run)arcadeSessionSave('runner',{score,player,obstacles,frame})});start();</script></body></html>
