<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky Hopper</title><style>body{margin:0;background:#dff5ff;color:#16355b;font-family:system-ui,sans-serif;text-align:center}main{width:min(650px,calc(100% - 28px));margin:auto;padding:25px 0}.top{display:flex;justify-content:space-between;align-items:center}a{color:#2457c5}.button{border:0;border-radius:99px;padding:10px 17px;background:#ffd85e;color:#16355b;font:inherit;font-weight:900;cursor:pointer}h1{font-size:clamp(32px,7vw,56px);letter-spacing:-.08em;margin:20px 0 5px}#score{font-weight:950;color:#ef6b50;font-size:22px}canvas{display:block;width:100%;height:auto;border:4px solid #2457c5;border-radius:18px;background:#8cddf7;box-shadow:0 18px 45px #2455c533}.hint{color:#557092;font-size:14px}</style></head><body><main><div class="top"><a href="index.html">← Arcade</a><button class="button" id="restart">Restart</button></div><h1>Sky Hopper</h1><p>Score: <span id="score">0</span></p><canvas id="game" width="600" height="700"></canvas><p class="hint">Click, tap, or press Space to flap.</p></main><script>
const c=document.querySelector('#game'),x=c.getContext('2d'),s=document.querySelector('#score');let bird,pipes,frame,playing;function start(){bird={x:125,y:330,vy:0};pipes=[];frame=0;playing=true;s.textContent=0;requestAnimationFrame(loop)}function flap(){if(!playing){start();return}bird.vy=-6.5}function loop(){if(!playing){draw();return}frame++;bird.vy+=.22;bird.y+=bird.vy;if(frame%112===1){let gap=190,top=80+Math.random()*250;pipes.push({x:620,top,gap,passed:false})}for(const p of pipes)p.x-=2.7;pipes=pipes.filter(p=>p.x>-70);for(const p of pipes){if(!p.passed&&p.x+58<bird.x){p.passed=true;s.textContent=Number(s.textContent)+1}if(bird.x+22>p.x&&bird.x-22<p.x+58&&(bird.y-18<p.top||bird.y+18>p.top+p.gap))end()}if(bird.y<0||bird.y>700)end();draw();requestAnimationFrame(loop)}function end(){playing=false}function draw(){x.clearRect(0,0,600,700);x.fillStyle='#8cddf7';x.fillRect(0,0,600,700);x.fillStyle='#fff8cf';for(let i=0;i<6;i++)x.fillRect((i*137+40)%600,80+(i%3)*130,75,14);x.fillStyle='#43b876';for(const p of pipes){x.fillRect(p.x,0,58,p.top);x.fillRect(p.x,p.top+p.gap,58,700)}x.fillStyle='#ffd85e';x.beginPath();x.arc(bird.x,bird.y,22,0,Math.PI*2);x.fill();x.fillStyle='#ef6b50';x.beginPath();x.moveTo(bird.x+18,bird.y);x.lineTo(bird.x+38,bird.y+8);x.lineTo(bird.x+18,bird.y+14);x.fill();if(!playing){x.fillStyle='#16355bcc';x.fillRect(0,0,600,700);x.fillStyle='#fff';x.font='bold 36px system-ui';x.textAlign='center';x.fillText('Try again!',300,330);x.font='18px system-ui';x.fillText('Tap the game or Restart',300,370)}}addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap()}});c.addEventListener('pointerdown',flap);document.querySelector('#restart').onclick=start;start();</script></body></html>
