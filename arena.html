<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upgrade Arena</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080d18;color:#eef5ff;font-family:system-ui,sans-serif}.wrap{width:min(95vw,980px);text-align:center}h1{margin:0 0 4px;font-size:clamp(1.7rem,4vw,2.5rem)}.sub{margin:0 0 12px;color:#aab8d4}.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px;font-size:.85rem;font-weight:700}.stat{padding:8px 5px;border:1px solid #293858;border-radius:10px;background:#111a2e}.stat span{display:block;color:#6ce5ff;margin-top:2px}.bar{height:7px;margin-top:5px;background:#29334b;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#55e391}.canvas{display:block;width:100%;aspect-ratio:16/9;border:2px solid #293858;border-radius:16px;background:var(--arcade-canvas,#111827);box-shadow:0 18px 60px #0009;cursor:crosshair;touch-action:none}.help{margin:11px 0 0;color:#c4cee2;font-size:.9rem}kbd{padding:2px 6px;border:1px solid #596b91;border-radius:5px;background:#1c2946}button{margin-top:15px;padding:11px 25px;border:0;border-radius:999px;background:#6ce5ff;color:#07111e;font:inherit;font-weight:800;cursor:pointer}.hidden{display:none}@media(max-width:620px){.hud{grid-template-columns:repeat(3,1fr)}.stat:nth-child(4),.stat:nth-child(5){display:none}}
</style></head><body><main class="wrap"><a class="back" href="index.html" onclick="if(window.opener){window.close();return false}">← Arcade</a><h1>Upgrade Arena</h1><p class="sub">Build a tank, add guns, and outgrow the swarm.</p><section class="hud" aria-live="polite"><div class="stat">Health<span id="health">100 / 100</span><div class="bar"><i id="healthbar"></i></div></div><div class="stat">Kills<span id="kills">0</span></div><div class="stat">Boss<span id="boss">None</span></div><div class="stat">Tank<span id="tank">Lv. 1</span></div><div class="stat">Enemies<span id="enemies">0</span></div><div class="stat">Heal<span id="heal">Ready</span></div></section><canvas id="game" class="canvas" aria-label="Upgrade Arena shooter"></canvas><p class="help"><kbd>WASD</kbd> move · Aim with mouse · Hold <kbd>Left Click</kbd> to fire · <kbd>F</kbd> heal · collect green medkits</p><button id="restart" class="hidden">Restart game</button></main>
<script src="shared.js?v=20261003"></script><script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id),keys=new Set(),bullets=[],enemies=[],kits=[],particles=[],player={x:0,y:0,r:15,speed:235,hp:100,max:100,angle:0,fire:0,heal:0};let w,h,worldW,worldH,camX=0,camY=0,kills=0,level=1,bossLevel=0,spawn=0,kitTimer=3,over=false,last=0,raf,mouse={x:0,y:0,down:false};
function resize(){const d=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);w=r.width;h=r.height;worldW=w*1.8;worldH=h*1.8;player.x=worldW/2;player.y=worldH/2}
function ui(){$('health').textContent=`${Math.ceil(player.hp)} / ${player.max}`;$('healthbar').style.width=`${Math.max(0,player.hp/player.max*100)}%`;$('kills').textContent=kills;$('tank').textContent=`Lv. ${level}`;$('boss').textContent=enemies.some(e=>e.boss)?(enemies.some(e=>e.mega)?`MEGA Lv. ${level}`:enemies.some(e=>e.ultra)?`ULTRA Lv. ${level}`:`Lv. ${level}`):'None';$('enemies').textContent=enemies.length;$('heal').textContent=player.heal>0?`${Math.ceil(player.heal)}s`:'Ready'}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function burst(x,y,color,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*140,vy:(Math.random()-.5)*140,life:.45,color})}function edge(){const q=Math.floor(Math.random()*4);return q===0?{x:Math.random()*worldW,y:-30}:q===1?{x:worldW+30,y:Math.random()*worldH}:q===2?{x:Math.random()*worldW,y:worldH+30}:{x:-30,y:Math.random()*worldH}}
function spawnEnemy(){const pos=edge(),roll=Math.random();if(level>=100&&level%100===0&&bossLevel!==level){bossLevel=level;const hp=(1800+level*420)*10000;enemies.push({x:pos.x,y:pos.y,r:112,hp,max:hp,type:'boss',boss:true,ultra:true,mega:true,speed:36+level*.6,attack:0,shoot:1.1,healTimer:1.5});const guardHp=(1800+level*420)*5000;for(let i=0;i<10;i++){const a=i*Math.PI*2/10,gx=Math.max(90,Math.min(worldW-90,pos.x+Math.cos(a)*190)),gy=Math.max(90,Math.min(worldH-90,pos.y+Math.sin(a)*190));enemies.push({x:gx,y:gy,r:82,hp:guardHp,max:guardHp,type:'boss',boss:true,ultra:true,megaGuard:true,guardIndex:i,speed:46+level*.7,attack:0,shoot:1.1,healTimer:1.5})}return}if(level>=50&&level%50===0&&bossLevel!==level){bossLevel=level;const hp=(1800+level*420)*1000;enemies.push({x:pos.x,y:pos.y,r:76,hp,max:hp,type:'boss',boss:true,ultra:true,speed:42+level*.8,attack:0,shoot:1.1,healTimer:1.5});return}if(level>=10&&level%10===0&&bossLevel!==level){bossLevel=level;const hp=(1800+level*420)*25;enemies.push({x:pos.x,y:pos.y,r:48,hp,max:hp,type:'boss',boss:true,speed:48+level*1.1,attack:0,shoot:1.2,healTimer:1.5});return}let type='melee';if(level>=5&&roll<.1)type='splitter';else if(level>=4&&roll<.18)type='tank';else if(level>=3&&roll<.32)type='shooter';else if(level>=3&&roll<.42)type='healer';else if(level>=2&&roll<.58)type='buffer';else if(level>=2&&roll<.7)type='charger';let hp=48+level*18+(type==='buffer'?55:type==='shooter'?30:type==='tank'?150:type==='charger'?22:type==='healer'?42:type==='splitter'?90:0);enemies.push({x:pos.x,y:pos.y,r:type==='buffer'||type==='healer'?20:type==='tank'||type==='splitter'?24:16,hp,max:hp,type,speed:type==='tank'||type==='splitter'?Math.min(58,28+level*2):type==='charger'?Math.min(115,70+level*2):Math.min(98,40+level*3+Math.random()*12),attack:0,shoot:1+Math.random()*2,healTimer:1.5})}function reset(){bullets.length=enemies.length=kits.length=particles.length=0;kills=0;level=1;bossLevel=0;spawn=.2;kitTimer=3;over=false;player.hp=player.max=100;player.speed=235;player.heal=0;mouse.down=false;$('restart').classList.add('hidden');ui();cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(loop)}
function upgrade(){const old=level;level=1+Math.floor(kills/3);if(level>old){const oldMax=player.max;player.max=100+(level-1)*70;player.hp=Math.min(player.max,player.hp+(player.max-oldMax)+120);player.speed=235+(level-1)*6;burst(player.x,player.y,'#6ce5ff',24)}}
function fire(){const guns=level>=7?5:level>=5?3:level>=3?2:1,damage=60+level*45,spread=guns>1?.14:0;for(let i=0;i<guns;i++){const a=player.angle+(i-(guns-1)/2)*spread;bullets.push({x:player.x+Math.cos(a)*20,y:player.y+Math.sin(a)*20,vx:Math.cos(a)*(640+level*32),vy:Math.sin(a)*(640+level*32),r:Math.min(7,4+level*.27),damage,life:1,enemy:false});if(level>=10){const pixels=Math.min(120,24+Math.floor((level-10)/2)*12);for(let i=0;i<pixels;i++){const a=i*Math.PI*2/pixels;bullets.push({x:player.x+Math.cos(a)*20,y:player.y+Math.sin(a)*20,vx:Math.cos(a)*(640+level*32),vy:Math.sin(a)*(640+level*32),r:Math.min(7,4+level*.27),damage,life:1,enemy:false})}}}}
function enemyFire(e){const a=Math.atan2(player.y-e.y,player.x-e.x);bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*280,vy:Math.sin(a)*280,r:5,damage:12+level*1.5,life:3,enemy:true})}function hurt(amount){player.hp-=amount;burst(player.x,player.y,'#ff7180',4);if(player.hp<=0){player.hp=0;over=true;$('restart').classList.remove('hidden')}}
function update(dt){const dx=(keys.has('d')||keys.has('ArrowRight'))-(keys.has('a')||keys.has('ArrowLeft')),dy=(keys.has('s')||keys.has('ArrowDown'))-(keys.has('w')||keys.has('ArrowUp')),len=Math.hypot(dx,dy)||1;player.x=Math.max(player.r,Math.min(worldW-player.r,player.x+dx/len*player.speed*dt));player.y=Math.max(player.r,Math.min(worldH-player.r,player.y+dy/len*player.speed*dt));player.angle=Math.atan2(mouse.y+camY-player.y,mouse.x+camX-player.x);player.fire-=dt;player.heal=Math.max(0,player.heal-dt);player.hp=Math.min(player.max,player.hp+dt*(1.2+level*.3));if(mouse.down&&player.fire<=0){fire();player.fire=Math.max(.06,.18-level*.012)}spawn-=dt;if(spawn<=0){spawnEnemy();spawn=Math.max(.14,.8-level*.04)}kitTimer-=dt;if(kitTimer<=0&&kits.length<3){kits.push({x:30+Math.random()*(worldW-60),y:30+Math.random()*(worldH-60),r:12,t:0});kitTimer=6}
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.enemy){if(distance(b,player)<b.r+player.r){hurt(b.damage);bullets.splice(i,1);continue}}else{let hit=false;for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(distance(b,e)<e.r+b.r){const impact=b.damage;e.hp-=impact;if(e.boss){const blast=impact*3;for(const q of enemies){if(q!==e&&distance(q,e)<180)q.hp=Math.max(1,q.hp-blast*.65)}burst(e.x,e.y,e.mega?'#ff5a36':'#ffd166',28)}hit=true;burst(b.x,b.y,'#ffe66d',3);if(e.hp<=0){kills++;if(kills%20===0)arcadeAddPoints(20,'arena');upgrade();burst(e.x,e.y,e.type==='buffer'?'#bf83ff':'#ff7180',14);if(Math.random()<.22)kits.push({x:e.x,y:e.y,r:12,t:0});enemies.splice(j,1)}break}}if(hit){bullets.splice(i,1);continue}}if(b.life<=0||b.x<0||b.x>worldW||b.y<0||b.y>worldH)bullets.splice(i,1)}
for(const e of enemies){if(e.megaGuard){const anchor=enemies.find(q=>q.mega);if(anchor){const ga=e.guardIndex*Math.PI*2/10,orbit=anchor.r+78,tx=anchor.x+Math.cos(ga)*orbit,ty=anchor.y+Math.sin(ga)*orbit,gd=Math.hypot(tx-e.x,ty-e.y);if(gd>8){e.x+=((tx-e.x)/gd)*Math.min(e.speed,150)*dt;e.y+=((ty-e.y)/gd)*Math.min(e.speed,150)*dt}}const gd=distance(e,player);if(gd<e.r+player.r+18){e.attack-=dt;if(e.attack<=0){hurt(1100+level*60);e.attack=.7}}continue}const d=distance(e,player),a=Math.atan2(player.y-e.y,player.x-e.x),nearBuff=enemies.some(q=>q!==e&&q.type==='buffer'&&distance(q,e)<150),speed=Math.min(124,e.speed*(nearBuff&&e.type!=='buffer'?1.28:1));if(e.type==='melee'||e.type==='tank'||e.type==='charger'||e.type==='boss'){const reach=e.r+player.r+18;if(d>reach){const rush=e.type==='charger'&&d<220?1.35:1;e.x+=Math.cos(a)*speed*rush*dt;e.y+=Math.sin(a)*speed*rush*dt}else{e.attack-=dt;if(e.attack<=0){const damage=e.type==='boss'?(e.megaGuard?1100+level*60:e.mega?2200+level*120:e.ultra?220+level*12:70+level*5):e.type==='tank'?25+level*2:e.type==='charger'?21+level*1.5:15+level*1.2;hurt(damage);e.attack=e.type==='charger'?1.05:.7}}}else if(e.type==='shooter'){const preferred=245;if(d>preferred+30){e.x+=Math.cos(a)*speed*dt;e.y+=Math.sin(a)*speed*dt}else if(d<preferred-30){e.x-=Math.cos(a)*speed*dt;e.y-=Math.sin(a)*speed*dt}e.shoot-=dt;if(e.shoot<=0){enemyFire(e);e.shoot=Math.max(.65,2.1-level*.05)}}else if(d>135){e.x+=Math.cos(a)*speed*.65*dt;e.y+=Math.sin(a)*speed*.65*dt}}
for(let i=kits.length-1;i>=0;i--){const k=kits[i];k.t+=dt;if(distance(k,player)<k.r+player.r){player.hp=Math.min(player.max,player.hp+35);kits.splice(i,1);burst(k.x,k.y,'#55e391',10)}}for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;if(q.life<=0)particles.splice(i,1)}ui()}
function draw(){const pack=arcadeTexturePack();camX=Math.max(0,Math.min(worldW-w,player.x-w/2));camY=Math.max(0,Math.min(worldH-h,player.y-h/2));ctx.save();ctx.translate(-camX,-camY);ctx.fillStyle=arcadeCanvasBackground();ctx.fillRect(0,0,worldW,worldH);ctx.strokeStyle='#18243c';for(let i=0;i<worldW;i+=32){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,worldH);ctx.stroke()}for(let i=0;i<worldH;i+=32){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(worldW,i);ctx.stroke()}for(const k of kits){ctx.fillStyle='#55e391';ctx.shadowColor='#55e391';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(k.x,k.y,k.r+Math.sin(k.t*4)*2,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#123';ctx.fillRect(k.x-3,k.y-8,6,16);ctx.fillRect(k.x-8,k.y-3,16,6)}for(const b of bullets){ctx.fillStyle=b.enemy?(pack==='ocean'?'#ff8bd8':'#ff9b75'):(pack==='forest'?'#b8ff72':'#ffe66d');ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.fillStyle='#ffffffaa';ctx.fillRect(b.x-b.r*.5,b.y-b.r*.5,b.r,b.r*.35)}for(const e of enemies){const color=e.megaGuard?'#ff9f43':e.megaGuard?'#ff9f43':e.mega?'#ff5a36':e.ultra?'#ffd166':e.type==='boss'?'#ff3d8d':e.type==='buffer'?'#b77cff':e.type==='shooter'?'#ffab5c':'#ef6573';if(e.type==='buffer'){ctx.strokeStyle='#d8b7ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,150,0,7);ctx.stroke()}if(e.boss){ctx.strokeStyle=e.megaGuard?'#ffd27a':e.mega?'#ffd0a8':e.ultra?'#fff1a8':'#ffb3dc';ctx.lineWidth=e.megaGuard?7:e.mega?11:e.ultra?8:5;ctx.beginPath();ctx.arc(e.x,e.y,e.r+10+Math.sin(performance.now()/180)*3,0,7);ctx.stroke()}ctx.fillStyle=color;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.save();ctx.beginPath();ctx.arc(e.x,e.y,e.r*.82,0,7);ctx.clip();ctx.strokeStyle=pack==='pixel'?'#ffe66d':'#ffffff66';ctx.lineWidth=3;for(let yy=e.y-e.r*2;yy<e.y+e.r*2;yy+=8){ctx.beginPath();ctx.moveTo(e.x-e.r*2,yy);ctx.lineTo(e.x+e.r*2,yy+12);ctx.stroke()}ctx.restore();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.x-5,e.y-3,2.5,0,7);ctx.arc(e.x+5,e.y-3,2.5,0,7);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(e.x-e.r,e.y-e.r-8,e.r*2,4);ctx.fillStyle='#67e391';ctx.fillRect(e.x-e.r,e.y-e.r-8,e.r*2*Math.max(0,e.hp/e.max),4)}for(const q of particles){ctx.globalAlpha=Math.max(0,q.life*2);ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(q.x,q.y,3,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle);ctx.fillStyle=arcadeTankColor();ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=15;ctx.beginPath();ctx.arc(0,0,player.r,0,7);ctx.fill();ctx.fillStyle='#ffffff66';ctx.fillRect(-8,-8,12,5);const guns=level>=7?5:level>=5?3:level>=3?2:1;ctx.fillStyle='#d4fbff';for(let i=0;i<guns;i++){const offset=(i-(guns-1)/2)*7;ctx.fillRect(7,-4+offset,36,8)}ctx.restore();ctx.restore();drawMinimap();if(over){ctx.fillStyle='#020611bb';ctx.fillRect(0,0,w,h);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='800 34px system-ui';ctx.fillText('You were overrun',w/2,h/2-12);ctx.font='16px system-ui';ctx.fillText(`Kills: ${kills} · Tank Lv. ${level}`,w/2,h/2+22)}}
function drawMinimap(){const mw=Math.min(170,w*.27),mh=mw*.58,mx=w-mw-14,my=14;ctx.save();ctx.fillStyle='#07101ddd';ctx.fillRect(mx,my,mw,mh);ctx.strokeStyle='#6ce5ff';ctx.lineWidth=2;ctx.strokeRect(mx,my,mw,mh);const sx=mw/worldW,sy=mh/worldH;for(const e of enemies){ctx.fillStyle=e.mega?'#ff5a36':e.ultra?'#ffd166':e.boss?'#ff3d8d':e.type==='shooter'?'#ffab5c':'#ef6573';ctx.beginPath();ctx.arc(mx+e.x*sx,my+e.y*sy,e.boss?5:3,0,7);ctx.fill()}ctx.fillStyle='#6ce5ff';ctx.beginPath();ctx.arc(mx+player.x*sx,my+player.y*sy,4,0,7);ctx.fill();ctx.fillStyle='#d9e7ff';ctx.font='bold 10px system-ui';ctx.fillText('MAP',mx+7,my+12);ctx.restore()}function loop(now){const dt=Math.min((now-last)/1000,.035);last=now;if(!over)update(dt);draw();if(!over)raf=requestAnimationFrame(loop)}function heal(){if(!over&&player.heal<=0&&player.hp<player.max){player.hp=Math.min(player.max,player.hp+45);player.heal=20;burst(player.x,player.y,'#55e391',18);ui()}}function pointer(e){const r=c.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top}window.addEventListener('resize',resize);window.addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','f',' '].includes(k))e.preventDefault();keys.add(k);if(k==='f')heal();if(k===' '&&over)reset()});window.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));c.addEventListener('pointermove',pointer);c.addEventListener('pointerdown',e=>{pointer(e);mouse.down=true;c.setPointerCapture(e.pointerId)});c.addEventListener('pointerup',()=>mouse.down=false);c.addEventListener('pointercancel',()=>mouse.down=false);$('restart').onclick=reset;resize();reset()})();
</script><script src="script.js"></script></body></html>
