<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fruit Merge</title><style>body{margin:0;background:#fff5df;color:#4d2f35;font-family:system-ui,sans-serif;text-align:center}main{width:min(680px,calc(100% - 28px));margin:auto;padding:25px 0}.top{display:flex;justify-content:space-between;align-items:center}a{color:#c95648}.button{border:0;border-radius:99px;padding:10px 17px;background:#ffd85e;color:#4d2f35;font:inherit;font-weight:900;cursor:pointer}h1{font-size:clamp(32px,7vw,56px);letter-spacing:-.08em;margin:20px 0 5px}.stats{display:flex;justify-content:center;gap:22px;margin:8px 0;color:#8c6862;font-weight:800}.stats b{color:#d65c49;font-size:20px}.picker{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px;margin:13px 0 15px}.picker-label{color:#8c6862;font-size:13px;font-weight:800}.pick{border:2px solid #edc28b;border-radius:12px;padding:6px 8px;background:#fff9e9;font-size:20px;cursor:pointer}.pick.selected{border-color:#d65c49;background:#ffd9a6;box-shadow:0 0 0 3px #fff}.sub{color:#8c6862;font-size:14px}canvas{display:block;width:100%;height:auto;border:4px solid #d65c49;border-radius:18px;background:#fff1ca;box-shadow:0 18px 45px #b95d3d2b}</style></head><body><main><div class="top"><a href="index.html">← Arcade</a><button class="button" id="restart">Restart</button></div><h1>Fruit Merge</h1><div class="stats"><span>Score: <b id="score">0</b></span><span>Lives: <b id="lives">3</b></span><span>Next life: <b id="checkpoint">100</b></span></div><p>Choose a fruit, then click where to drop it</p><div class="picker"><span class="picker-label">Fruit:</span><button class="pick selected" data-type="0">🍒</button><button class="pick" data-type="1">🍓</button><button class="pick" data-type="2">🍊</button><button class="pick" data-type="3">🍎</button><button class="pick" data-type="4">🍋</button><button class="pick" data-type="5">🍑</button><button class="pick" data-type="6">🍈</button><button class="pick" data-type="7">🍉</button><button class="pick" data-type="8">🍍</button><button class="pick" data-type="9">🥥</button><button class="pick" data-type="10">🥝</button><button class="pick" data-type="11">🍇</button><button class="pick" data-type="12">🍐</button><button class="pick" data-type="13">🍌</button><button class="pick" data-type="14">🌟</button><button class="pick" data-type="15">🌈</button><button class="pick" data-type="16">💎</button><button class="pick" data-type="17">👑</button></div><canvas id="game" width="600" height="900"></canvas><p class="sub">Fruits touch edge-to-edge, with no circles drawn around them.</p></main><script>const c=document.querySelector('#game'),x=c.getContext('2d'),worldStart=900,scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives'),checkpointEl=document.querySelector('#checkpoint'),picks=[...document.querySelectorAll('.pick')],fruits=[['🍒',18],['🍓',25],['🍊',32],['🍎',40],['🍋',48],['🍑',57],['🍈',67],['🍉',77],['🍍',88],['🥥',99],['🥝',110],['🍇',122],['🍐',135],['🍌',148],['🌟',162],['🌈',176],['💎',190],['👑',204]];let balls=[],score=0,lives=3,nextCheckpoint=100,active=null,over=false,selectedType=0,unlocked=3,worldH=worldStart;function stats(){scoreEl.textContent=score;livesEl.textContent=lives;checkpointEl.textContent=Math.max(0,nextCheckpoint-score)}function start(){balls=[];score=0;lives=3;nextCheckpoint=100;active=null;over=false;unlocked=3;worldH=worldStart;c.height=worldH;stats();requestAnimationFrame(loop)}function add(px){if(over){start();return}const f=fruits[selectedType];active={x:Math.max(f[1],Math.min(600-f[1],px)),y:35,vy:0,r:f[1],type:selectedType,variant:false};setTimeout(()=>{if(active){balls.push(active);active=null}},120)}function collide(){for(let pass=0;pass<5;pass++)for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,min=a.r+b.r;if(d<=min){const nx=dx/d,ny=dy/d,fix=(min-d)/2;a.x-=nx*fix;a.y-=ny*fix;b.x+=nx*fix;b.y+=ny*fix;if(Math.abs(ny)>.65){if(ny>0){a.vy=Math.min(0,a.vy);b.vy=Math.max(0,b.vy)}else{b.vy=Math.min(0,b.vy);a.vy=Math.max(0,a.vy)}}}}}function physics(){for(let step=0;step<4;step++){for(const b of balls){b.vy+=.16;b.y+=b.vy/4;if(b.x-b.r<0)b.x=b.r;if(b.x+b.r>600)b.x=600-b.r;if(b.y+b.r>=worldH){b.y=worldH-b.r;b.vy=0}}collide()}let again=true;while(again){again=false;outer:for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j];if(a.type===b.type&&Math.hypot(a.x-b.x,a.y-b.y)<=a.r+b.r+2){let n;if(a.type<fruits.length-1){n={type:a.type+1,r:fruits[a.type+1][1],variant:false}}else{const nextSize=fruits[a.type][1]+35;fruits.push(['✦',nextSize]);n={type:fruits.length-1,r:nextSize,variant:false}}balls.splice(j,1);balls.splice(i,1);balls.push({x:(a.x+b.x)/2,y:Math.min(a.y,b.y),vy:-5,...n});score+=(a.type+1)*10;if(a.type+1>unlocked){unlocked=a.type+1;worldH+=80;c.height=worldH}while(score>=nextCheckpoint){lives++;nextCheckpoint+=100}stats();again=true;break outer}}}const culprit=balls.find(b=>b.y-b.r<60&&b.vy===0);if(culprit){balls=balls.filter(b=>b!==culprit);lives--;if(lives<=0)over=true;stats()}}function drawSquishy(b){const r=b.r,colors=['#ef4444','#22c55e','#3b82f6','#a855f7','#f97316','#ec4899','#14b8a6','#eab308','#06b6d4','#f43f5e','#84cc16','#8b5cf6','#0ea5e9','#d946ef','#64748b','#f59e0b','#10b981','#6366f1'],color=colors[b.type%colors.length],shape=b.type%8,tilt=(b.type*.37)%1.2,stretch=1+(b.type%5)*.08;x.save();x.translate(b.x,b.y);x.rotate(tilt);x.scale(stretch,2-stretch);x.translate(-b.x,-b.y);function path(){x.beginPath();if(shape===0){x.arc(b.x,b.y,r,0,Math.PI*2)}else if(shape===1){x.moveTo(b.x-r*.85,b.y-r*.35);x.quadraticCurveTo(b.x-r*.55,b.y-r*1.1,b.x,b.y-r*.78);x.quadraticCurveTo(b.x+r*.75,b.y-r*1.05,b.x+r*.8,b.y-r*.1);x.quadraticCurveTo(b.x+r*1.05,b.y+r*.65,b.x+r*.2,b.y+r*.82);x.quadraticCurveTo(b.x-r*.7,b.y+r*1.05,b.x-r*.85,b.y-r*.35)}else if(shape===2){x.roundRect(b.x-r*.82,b.y-r*.82,r*1.64,r*1.64,r*.28)}else if(shape===3){x.moveTo(b.x,b.y-r);x.quadraticCurveTo(b.x+r*1.05,b.y-r*.5,b.x+r*.72,b.y+r*.7);x.quadraticCurveTo(b.x,b.y+r*1.08,b.x-r*.72,b.y+r*.7);x.quadraticCurveTo(b.x-r*1.05,b.y-r*.5,b.x,b.y-r)}else if(shape===4){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.55:r;const px=b.x+Math.cos(a)*rr,py=b.y+Math.sin(a)*rr;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath()}else if(shape===5){x.moveTo(b.x,b.y+r);x.bezierCurveTo(b.x-r*1.2,b.y+r*.35,b.x-r*1.05,b.y-r*.55,b.x-r*.45,b.y-r*.45);x.bezierCurveTo(b.x-r*.1,b.y-r*1.1,b.x,b.y-r*.6,b.x,b.y-r*.35);x.bezierCurveTo(b.x,b.y-r*.6,b.x+r*.1,b.y-r*1.1,b.x+r*.45,b.y-r*.45);x.bezierCurveTo(b.x+r*1.05,b.y-r*.55,b.x+r*1.2,b.y+r*.35,b.x,b.y+r)}else if(shape===6){x.arc(b.x-r*.38,b.y,r*.48,0,Math.PI*2);x.arc(b.x+r*.05,b.y-r*.25,r*.58,0,Math.PI*2);x.arc(b.x+r*.5,b.y,r*.45,0,Math.PI*2);x.closePath()}else{x.moveTo(b.x-r*.9,b.y);x.quadraticCurveTo(b.x-r*.45,b.y-r*1.05,b.x,b.y-r*.7);x.quadraticCurveTo(b.x+r*.5,b.y-r*1.08,b.x+r*.9,b.y);x.quadraticCurveTo(b.x+r*.48,b.y+r*1.08,b.x,b.y+r*.72);x.quadraticCurveTo(b.x-r*.5,b.y+r*1.08,b.x-r*.9,b.y)}}path();const g=x.createRadialGradient(b.x-r*.3,b.y-r*.45,2,b.x,b.y,r*1.2);g.addColorStop(0,'#fff3b0');g.addColorStop(.28,color);g.addColorStop(1,'#b97932');x.fillStyle=g;x.fill();x.save();path();x.clip();x.globalAlpha=.25;x.strokeStyle='#fff7c7';x.lineWidth=Math.max(2,r*.07);for(let i=-r*2;i<r*2;i+=r*.32){x.beginPath();x.moveTo(b.x-r*2,b.y+i);x.lineTo(b.x+r*2,b.y+i+r*.7);x.stroke()}x.globalAlpha=1;x.restore();x.fillStyle='#5c3b2a';x.beginPath();x.arc(b.x-r*.3,b.y-r*.12,r*.1,0,Math.PI*2);x.arc(b.x+r*.3,b.y-r*.12,r*.1,0,Math.PI*2);x.fill();x.strokeStyle='#5c3b2a';x.lineWidth=Math.max(2,r*.06);x.beginPath();x.arc(b.x,b.y+r*.08,r*.25,0,Math.PI);x.stroke();if(b.variant){x.fillStyle='#fff';x.font=`${Math.max(14,r*.28)}px serif`;x.fillText('✦',b.x+r*.72,b.y-r*.72)}x.restore()}function draw(){x.clearRect(0,0,600,worldH);x.fillStyle='#fff1ca';x.fillRect(0,0,600,worldH);x.strokeStyle='#efb35b';x.setLineDash([7,8]);x.beginPath();x.moveTo(0,60);x.lineTo(600,60);x.stroke();x.setLineDash([]);[...balls,active].filter(Boolean).forEach(drawSquishy);if(over){x.fillStyle='#4d2f35dd';x.fillRect(0,0,600,worldH);x.fillStyle='#fff';x.font='bold 36px system-ui';x.textAlign='center';x.fillText('Out of lives!',300,330);x.font='18px system-ui';x.fillText('Tap the game or Restart',300,370)}}function loop(){if(!over)physics();draw();requestAnimationFrame(loop)}picks.forEach(btn=>btn.onclick=()=>{selectedType=+btn.dataset.type;picks.forEach(p=>p.classList.toggle('selected',p===btn))});c.onpointerdown=e=>{const r=c.getBoundingClientRect();add((e.clientX-r.left)*600/r.width)};restart.onclick=start;start();</script></body></html>
