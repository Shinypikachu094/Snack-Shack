<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fruit Merge</title><style>body{margin:0;background:#fff5df;color:#4d2f35;font-family:system-ui,sans-serif;text-align:center}main{width:min(680px,calc(100% - 28px));margin:auto;padding:25px 0}.top{display:flex;justify-content:space-between;align-items:center}a{color:#c95648}.button{border:0;border-radius:99px;padding:10px 17px;background:#ffd85e;color:#4d2f35;font:inherit;font-weight:900;cursor:pointer}h1{font-size:clamp(32px,7vw,56px);letter-spacing:-.08em;margin:20px 0 5px}.stats{display:flex;justify-content:center;gap:22px;margin:8px 0;color:#8c6862;font-weight:800}.stats b{color:#d65c49;font-size:20px}.picker{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px;margin:13px 0 15px}.picker-label{color:#8c6862;font-size:13px;font-weight:800}.pick{border:2px solid #edc28b;border-radius:12px;padding:6px 8px;background:#fff9e9;font-size:20px;cursor:pointer}.pick.selected{border-color:#d65c49;background:#ffd9a6;box-shadow:0 0 0 3px #fff}.sub{color:#8c6862;font-size:14px}canvas{display:block;width:100%;height:auto;border:4px solid #d65c49;border-radius:18px;background:var(--arcade-canvas,#fff1ca);box-shadow:0 18px 45px #b95d3d2b}</style></head><body><main><div class="top"><a href="index.html" onclick="if(window.opener){window.close();return false}">← Arcade</a><button class="button" id="restart">Restart</button></div><h1>Fruit Merge</h1><div class="stats"><span>Score: <b id="score">0</b></span><span>Lives: <b id="lives">3</b></span><span>Best: <b id="best">0</b></span><span>Next life: <b id="checkpoint">100</b></span></div><p>Choose a fruit, then click where to drop it</p><div class="picker"><span class="picker-label">Fruit:</span><button class="pick selected" data-type="0">🍒</button><button class="pick" data-type="1">🍓</button><button class="pick" data-type="2">🍊</button><button class="pick" data-type="3">🍎</button><button class="pick" data-type="4">🍋</button><button class="pick" data-type="5">🍑</button><button class="pick" data-type="6">🍈</button><button class="pick" data-type="7">🍉</button><button class="pick" data-type="8">🍍</button><button class="pick" data-type="9">🥥</button><button class="pick" data-type="10">🥝</button><button class="pick" data-type="11">🍇</button><button class="pick" data-type="12">🍐</button><button class="pick" data-type="13">🍌</button><button class="pick" data-type="14">🫐</button><button class="pick" data-type="15">🥭</button><button class="pick" data-type="16">🍏</button><button class="pick" data-type="17">🍅</button></div><canvas id="game" width="600" height="900"></canvas><p class="sub">Fruits touch edge-to-edge, with no circles drawn around them.</p></main><script src="shared.js?v=20261003"></script><script>const c=document.querySelector('#game'),x=c.getContext('2d'),worldStart=900,scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives'),bestEl=document.querySelector('#best'),checkpointEl=document.querySelector('#checkpoint'),picks=[...document.querySelectorAll('.pick')],fruits=[['🍒',18],['🍓',25],['🍊',32],['🍎',40],['🍋',48],['🍑',57],['🍈',67],['🍉',77],['🍍',88],['🥥',99],['🥝',110],['🍇',122],['🍐',135],['🍌',148],['🫐',162],['🥭',176],['🍏',190],['🍅',204]];let balls=[],score=0,best=Number(arcadeState().highScores.fruit||0),lives=3,nextCheckpoint=100,active=null,over=false,selectedType=0,unlocked=3,worldH=worldStart,nextExpansion=10000,fruitReward=0;function stats(){scoreEl.textContent=score;bestEl.textContent=best;livesEl.textContent=lives;checkpointEl.textContent=Math.max(0,nextCheckpoint-score)}function start(){balls=[];score=0;lives=3;nextCheckpoint=100;active=null;over=false;unlocked=3;fruitReward=0;worldH=worldStart;nextExpansion=10000;c.height=worldH;stats();requestAnimationFrame(loop)}function add(px){if(over){start();return}const f=fruits[selectedType];active={x:Math.max(f[1],Math.min(600-f[1],px)),y:35,vy:0,r:f[1],type:selectedType,variant:false};setTimeout(()=>{if(active){balls.push(active);active=null}},120)}function collide(){const passes=balls.length>70?1:2;for(let pass=0;pass<passes;pass++)for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,min=a.r+b.r;if(Math.abs(dx)>min||Math.abs(dy)>min)continue;const d=Math.hypot(dx,dy)||.001;if(d<=min){const nx=dx/d,ny=dy/d,fix=(min-d)/2;a.x-=nx*fix;a.y-=ny*fix;b.x+=nx*fix;b.y+=ny*fix;if(Math.abs(ny)>.65){if(ny>0){a.vy=Math.min(0,a.vy);b.vy=Math.max(0,b.vy)}else{b.vy=Math.min(0,b.vy);a.vy=Math.max(0,a.vy)}}}}}function physics(){const steps=balls.length>70?2:3;for(let step=0;step<steps;step++){for(const b of balls){b.vy+=.32;b.y+=b.vy/steps;if(b.x-b.r<0)b.x=b.r;if(b.x+b.r>600)b.x=600-b.r;if(b.y+b.r>=worldH){b.y=worldH-b.r;b.vy=0}}collide()}let again=true,merged=0;while(again&&merged<(balls.length>70?8:24)){again=false;outer:for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,min=a.r+b.r;if(a.type!==b.type||Math.abs(dx)>min+2||Math.abs(dy)>min+2||Math.hypot(dx,dy)>min+2)continue;let n;if(a.type<fruits.length-1){n={type:a.type+1,r:fruits[a.type+1][1],variant:false}}else{const nextSize=fruits[a.type][1]+35;fruits.push([['🍏','🥭','🍐','🍋','🍉','🍇'][fruits.length%6],nextSize]);n={type:fruits.length-1,r:nextSize,variant:false}}balls.splice(j,1);balls.splice(i,1);balls.push({x:(a.x+b.x)/2,y:Math.min(a.y,b.y),vy:-5,...n});score+=(a.type+1)*10;if(score>best){best=score;arcadeRecordScore('fruit',best)}const fruitMilestone=Math.floor(score/2000);if(fruitMilestone>fruitReward){arcadeAddPoints((fruitMilestone-fruitReward)*100,'fruit');fruitReward=fruitMilestone}if(a.type+1>unlocked){unlocked=a.type+1;worldH+=80;c.height=worldH}while(score>=nextCheckpoint){lives++;nextCheckpoint+=100}while(score>=nextExpansion){worldH+=250;nextExpansion+=10000;c.height=worldH}stats();merged++;again=true;break outer}}const culprit=balls.find(b=>b.y-b.r<60&&b.vy===0);if(culprit){balls=balls.filter(b=>b!==culprit);lives--;if(lives<=0){over=true;arcadeRecordScore('fruit',score)}stats()}}const fruitPalette=['#e94354','#ef6f9b','#f28d32','#e84242','#f4d35e','#f7a45b','#9bcf63','#f15b54','#f4b942','#b9855a','#74c85b','#8c52b8','#8dc85d','#f4d34f','#4c8ed9','#e18a3a','#73b84c','#e26b55'];let activePack='neon';function drawSquishy(b){const base=fruitPalette[b.type%fruitPalette.length];x.save();x.beginPath();x.arc(b.x,b.y,b.r*.86,0,Math.PI*2);x.clip();x.fillStyle=base;x.fillRect(b.x-b.r,b.y-b.r,b.r*2,b.r*2);const tint=activePack==='volcano'?'#fff1a855':activePack==='ocean'?'#b8ffff66':activePack==='forest'?'#d9ffb866':activePack==='candy'?'#ffd2f466':activePack==='sunset'?'#ffe0b866':activePack==='aurora'?'#d8ffff88':activePack==='pixel'?'#ffe66d99':activePack==='paper'?'#ffffff99':activePack==='lime'?'#efff9c88':activePack==='galaxy'?'#f5b5ff88':'#ffffff55';x.fillStyle=tint;if(activePack==='ocean'||activePack==='aurora'){for(let yy=-b.r*2;yy<b.r*2;yy+=Math.max(8,b.r*.42)){x.fillRect(b.x-b.r,b.y+yy,b.r*2,Math.max(3,b.r*.12));x.fillRect(b.x-b.r,b.y+yy+Math.max(5,b.r*.2),b.r*2,Math.max(2,b.r*.08))}}else if(activePack==='pixel'||activePack==='paper'){for(let xx=-b.r;xx<b.r;xx+=Math.max(7,b.r*.42))for(let yy=-b.r;yy<b.r;yy+=Math.max(7,b.r*.42))x.fillRect(b.x+xx,b.y+yy,Math.max(3,b.r*.16),Math.max(3,b.r*.16))}else if(activePack==='galaxy'){for(let i=-b.r;i<b.r;i+=Math.max(7,b.r*.38)){x.beginPath();x.arc(b.x+i,b.y-i*.35,Math.max(2,b.r*.08),0,Math.PI*2);x.fill()}}else if(activePack==='lime'){for(let i=-b.r*2;i<b.r*2;i+=Math.max(8,b.r*.45))x.fillRect(b.x-b.r+i,b.y-b.r,b.r*.18,b.r*2)}else{for(let i=-b.r*2;i<b.r*2;i+=Math.max(8,b.r*.45))x.fillRect(b.x-b.r+i,b.y-b.r,b.r*.18,b.r*2)}x.restore();x.font=`${b.r*1.55}px serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(fruits[b.type][0],b.x,b.y);x.fillStyle='#ffffffaa';x.beginPath();x.arc(b.x-b.r*.28,b.y-b.r*.3,Math.max(2,b.r*.1),0,Math.PI*2);x.fill()}function draw(){activePack=arcadeTexturePack();x.clearRect(0,0,600,worldH);x.fillStyle=arcadeCanvasBackground();x.fillRect(0,0,600,worldH);x.strokeStyle='#efb35b';x.setLineDash([7,8]);x.beginPath();x.moveTo(0,60);x.lineTo(600,60);x.stroke();x.setLineDash([]);for(const b of balls)drawSquishy(b);if(active)drawSquishy(active);if(over){x.fillStyle='#4d2f35dd';x.fillRect(0,0,600,worldH);x.fillStyle='#fff';x.font='bold 36px system-ui';x.textAlign='center';x.fillText('Out of lives!',300,330);x.font='18px system-ui';x.fillText('Tap the game or Restart',300,370)}}function loop(){if(!over)physics();draw();requestAnimationFrame(loop)}picks.forEach(btn=>btn.onclick=()=>{selectedType=+btn.dataset.type;picks.forEach(p=>p.classList.toggle('selected',p===btn))});c.onpointerdown=e=>{const r=c.getBoundingClientRect();add((e.clientX-r.left)*600/r.width)};restart.onclick=start;start();</script></body></html>
