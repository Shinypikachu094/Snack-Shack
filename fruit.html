<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fruit Merge</title><style>body{margin:0;background:#fff5df;color:#4d2f35;font-family:system-ui,sans-serif;text-align:center}main{width:min(650px,calc(100% - 28px));margin:auto;padding:25px 0}.top{display:flex;justify-content:space-between;align-items:center}a{color:#c95648}.button{border:0;border-radius:99px;padding:10px 17px;background:#ffd85e;color:#4d2f35;font:inherit;font-weight:900;cursor:pointer}h1{font-size:clamp(32px,7vw,56px);letter-spacing:-.08em;margin:20px 0 5px}#score{color:#d65c49;font-size:22px;font-weight:950}.sub{color:#8c6862;font-size:14px}canvas{display:block;width:100%;height:auto;border:4px solid #d65c49;border-radius:18px;background:#fff1ca;box-shadow:0 18px 45px #b95d3d2b}</style></head><body><main><div class="top"><a href="index.html">← Arcade</a><button class="button" id="restart">Restart</button></div><h1>Fruit Merge</h1><p>Score: <span id="score">0</span> · Click where you want to drop fruit</p><canvas id="game" width="600" height="700"></canvas><p class="sub">Match two of the same fruit to make the next one.</p></main><script>const c=document.querySelector('#game'),x=c.getContext('2d'),scoreEl=document.querySelector('#score');const fruits=[['🍒',18,'#ef6572'],['🍓',25,'#ed4c68'],['🍊',32,'#f5a23a'],['🍎',40,'#e85143'],['🍋',48,'#f6d457'],['🍑',57,'#f39b76'],['🍉',67,'#55bb6b']];let balls,score,active,over;function start(){balls=[];score=0;active=null;over=false;scoreEl.textContent=0;requestAnimationFrame(loop)}function add(px){if(over){start();return}const f=fruits[Math.floor(Math.random()*3)];active={x:Math.max(f[1],Math.min(600-f[1],px)),y:35,vy:0,r:f[1],type:fruits.indexOf(f)};setTimeout(()=>{if(active){balls.push(active);active=null}},120)}function loop(){for(const b of balls){b.vy+=.4;b.y+=b.vy;b.x=Math.max(b.r,Math.min(600-b.r,b.x));if(b.y+b.r>700){b.y=700-b.r;b.vy=0}}if(active){active.vy+=.4;active.y+=active.vy}let merged=true;while(merged){merged=false;outer:for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(a.type===b.type&&d<a.r+b.r+2&&a.type<fruits.length-1){const f=fruits[a.type+1];balls.splice(j,1);balls.splice(i,1);balls.push({x:(a.x+b.x)/2,y:Math.min(a.y,b.y),vy:-5,r:f[1],type:a.type+1});score+=(a.type+1)*10;scoreEl.textContent=score;merged=true;break outer}}}for(const b of balls)if(b.y-b.r<60&&b.vy===0)over=true;draw();requestAnimationFrame(loop)}function draw(){x.clearRect(0,0,600,700);x.fillStyle='#fff1ca';x.fillRect(0,0,600,700);x.strokeStyle='#efb35b';x.setLineDash([7,8]);x.beginPath();x.moveTo(0,60);x.lineTo(600,60);x.stroke();x.setLineDash([]);[...balls,active].filter(Boolean).forEach(b=>{x.font=`${b.r*1.65}px serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(fruits[b.type][0],b.x,b.y)});if(over){x.fillStyle='#4d2f35dd';x.fillRect(0,0,600,700);x.fillStyle='#fff';x.font='bold 36px system-ui';x.fillText('Fruit pile-up!',300,330);x.font='18px system-ui';x.fillText('Tap the game or Restart',300,370)}}c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();add((e.clientX-r.left)*600/r.width)});document.querySelector('#restart').onclick=start;start();</script></body></html>
